apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pwytch-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bilnaa/pwytch-cd
    targetRevision: main
    path: k8s/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # Pas de syncPolicy.automated : la prod ne se déploie que par un sync manuel
  # (UI : bouton SYNC, ou `argocd app sync pwytch-prod`).
  # Le cluster complète les volumeClaimTemplates (apiVersion, kind, status...) : sans ça, ArgoCD voit postgres OutOfSync en permanence.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: postgres
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    syncOptions:
      # server-side, comme les workflows du runner : chaque outil garde ses champs (voir argocd/README.md)
      - ServerSideApply=true
