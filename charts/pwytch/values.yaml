# Valeurs de base du chart. Les fichiers par environnement (dev, prod) ne surchargent que ce qui change.
# Le namespace de déploiement est celui de la release : helm install pwytch charts/pwytch -n <namespace>.
# Le chart ne crée pas le Namespace : il existe déjà, ou on passe --create-namespace.
# Les types et formats sont vérifiés par values.schema.json (lint, template, install).

# dev ou prod : label environment de toutes les ressources. Vide : le namespace de la release (-n dev / -n prod).
environment: ""

# Labels ajoutés en plus sur toutes les ressources (valeurs en texte : --set-string).
# Ne remplacent pas les labels du chart : une clé déjà utilisée par le chart est ignorée.
commonLabels: {}

# Images des 7 services : <registry>/<repositoryPrefix><service>:<tag>
image:
  registry: ghcr.io
  repositoryPrefix: bilnaa/pwytch-
  # sha complet (40 caractères) d'un commit du repo CI, jamais latest. Pas de valeur par défaut :
  # chaque environnement donne le sien (--set image.tag=<sha> ou fichier de values par environnement).
  tag: ""
  pullPolicy: IfNotPresent

# --- Infra stateful : postgres, redis, mosquitto ---
# Les noms des Services (postgres, redis, mqtt) sont fixes : les services les utilisent dans leurs URLs.
# Copie de k8s/dev et k8s/prod (10-12), qu'ArgoCD déploie encore : jusqu'à la bascule sur le chart,
# changer une image, une ressource ou une base ici ET dans k8s/, sinon les deux divergent.

postgres:
  image: postgres:18.0-alpine
  # Secret créé à la main (POSTGRES_USER, POSTGRES_PASSWORD), jamais dans Git
  credentialsSecret: postgres-credentials
  # Une base par service, créées au premier démarrage seulement (volume vide).
  # En ajouter une ici ne la crée pas sur un volume existant.
  databases:
    - main
    - live_chat
    - replay
    - search
    - bookmarks
    - stats
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

redis:
  image: redis:8.10.2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

mosquitto:
  image: eclipse-mosquitto:2.1.2-alpine
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }

# --- Configuration non secrète : ConfigMap pwytch-config ---
# Chaque service ne reçoit que les clés listées dans services.<nom>.config.
# Modifier une valeur redémarre seulement les services qui la lisent (annotation checksum/config sur leurs pods).
config:
  name: pwytch-config
  data:
    STREAM_URL: http://stream:8000
    LIVE_CHAT_URL: http://live-chat:8000
    REPLAY_URL: http://replay:8000
    SEARCH_URL: http://search:8000
    STATS_URL: http://stats:8000
    BOOKMARKS_URL: http://bookmarks:8000
    # origine du front autorisée par main (CORS) : pwytch.test en dev, pwytch.prd en prod
    FRONTEND_ORIGIN: http://pwytch.test
    MQTT_HOST: mqtt
    REDIS_URL: redis://redis:6379/0
    LIVES_DIR: /data/lives
    REPLAYS_DIR: /data/replays

# --- Secrets ---
# Créés à la main, une fois par namespace (voir le README), jamais dans Git ni dans les values.
# Le chart ne fait que les référencer par leur nom.
secrets:
  # une clé par service avec base : main, live_chat, replay, search, bookmarks, stats
  databaseUrls: database-urls
  # clé secret
  jwt: jwt

# Attente de postgres avant le démarrage des services qui ont une base
waitForPostgres:
  image: postgres:18.0-alpine
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

# --- Probes des 7 services, sur la route de services.<nom>.probePath ---
# startup : laisse le temps à l'appli de booter avant les deux autres (periodSeconds x failureThreshold = 150 s max).
# readiness : le pod sort du Service tant que l'appli ne répond pas.
# liveness : le pod redémarre si l'appli ne répond plus.
# Champs acceptés : initialDelaySeconds, periodSeconds, timeoutSeconds, failureThreshold, successThreshold.
probes:
  startup: { periodSeconds: 5, failureThreshold: 30 }
  readiness: { periodSeconds: 10, failureThreshold: 3 }
  liveness: { periodSeconds: 20, failureThreshold: 3 }

# --- Volumes persistants (un PVC chacun), montés par services.<nom>.volumes ---
# lives : segments HLS écrits par stream, relus par replay. replays : fichiers fabriqués par replay.
# ReadWriteOnce suffit sur un seul node (minikube) ; sur plusieurs nodes, stream et replay doivent tourner
# sur le même node, ou il faut un stockage ReadWriteMany.
# Les PVC sont gardés par helm uninstall (helm.sh/resource-policy: keep) : les fichiers ne partent pas avec la release.
volumes:
  lives:
    claimName: stream-lives
    size: 1Gi
    accessMode: ReadWriteOnce
  replays:
    claimName: replay-files
    size: 1Gi
    accessMode: ReadWriteOnce

# --- Les 7 services : un Deployment et un Service chacun, nommés comme la clé ---
# image : <image.registry>/<image.repositoryPrefix><nom>:<image.tag>. image.repository et image.tag
# d'un service remplacent ceux du chart pour ce service seulement (tag : sha complet, jamais latest).
# config : clés du ConfigMap passées en variables d'environnement.
# databaseUrlKey : clé du Secret databaseUrls passée en DATABASE_URL. Absente : pas de base, pas d'attente de postgres.
# jwt : passe la clé du Secret jwt en JWT_SECRET_KEY.
# probePath : route HTTP des probes (startup, readiness, liveness), qui répond 200 quand l'appli tourne.
# volumes : volumes (clés de volumes: plus haut) montés au chemin de la clé configKey du ConfigMap,
#   le même que celui que lit l'appli. readOnly : montage en lecture seule.
# autoscaling : HPA sur le CPU (pourcentage des requests). Activé, replicas n'est plus mis sur le Deployment,
#   le HPA gère le nombre de pods entre minReplicas et maxReplicas. Il faut metrics-server dans le cluster.
services:
  main:
    replicas: 1
    port: 8000
    config: [STREAM_URL, LIVE_CHAT_URL, REPLAY_URL, SEARCH_URL, STATS_URL, BOOKMARKS_URL, FRONTEND_ORIGIN, MQTT_HOST]
    databaseUrlKey: main
    jwt: true
    probePath: /api
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  stream:
    replicas: 1
    port: 8000
    config: [LIVES_DIR, MQTT_HOST]
    probePath: /health
    volumes:
      - { name: lives, configKey: LIVES_DIR }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  live-chat:
    replicas: 1
    port: 8000
    config: [REDIS_URL, MQTT_HOST]
    databaseUrlKey: live_chat
    probePath: /health
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  replay:
    replicas: 1
    port: 8000
    config: [MQTT_HOST, LIVES_DIR, REPLAYS_DIR]
    databaseUrlKey: replay
    probePath: /health
    volumes:
      - { name: lives, configKey: LIVES_DIR, readOnly: true }
      - { name: replays, configKey: REPLAYS_DIR }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  search:
    replicas: 1
    port: 8000
    config: [MQTT_HOST]
    databaseUrlKey: search
    probePath: /health
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  bookmarks:
    replicas: 1
    port: 8000
    config: [REDIS_URL, MQTT_HOST]
    databaseUrlKey: bookmarks
    probePath: /health
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  stats:
    replicas: 1
    port: 8000
    config: [REDIS_URL, MQTT_HOST]
    databaseUrlKey: stats
    probePath: /health
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
