# Un PVC par entrée de volumes, monté par les services qui le listent dans services.<nom>.volumes.
{{- range $key, $volume := .Values.volumes }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $volume.claimName }}
  namespace: {{ include "pwytch.namespace" $ }}
  labels:
    {{- include "pwytch.labels" $ | nindent 4 }}
  annotations:
    # gardé par helm uninstall : les lives et les replays survivent à la release
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ $volume.accessMode }}]
  resources:
    requests:
      storage: {{ $volume.size }}
{{- end }}
