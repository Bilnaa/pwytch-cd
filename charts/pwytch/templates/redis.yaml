# redis : Deployment sans volume, il ne sert que de cache (les services marchent sans lui)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "pwytch.namespace" . }}
  labels:
    {{- include "pwytch.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pwytch.selectorLabels" (dict "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ include "pwytch.namespace" . }}
  labels:
    {{- include "pwytch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pwytch.selectorLabels" (dict "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pwytch.selectorLabels" (dict "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
