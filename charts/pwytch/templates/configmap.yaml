# Configuration non secrète des 7 services. Chaque service ne lit que les clés listées dans services.<nom>.config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.name }}
  namespace: {{ include "pwytch.namespace" . }}
  labels:
    {{- include "pwytch.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
