apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      # sinon k8s injecte MQTT_PORT=tcp://... depuis le Service mqtt, ce qui casse la config des applis
      enableServiceLinks: false
      containers:
        - name: search
          image: ghcr.io/bilnaa/pwytch-search:2a5cb2c98f4a7abafdebac78b83286a2b92d524f
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: search
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: MQTT_HOST
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: dev
spec:
  selector:
    app: search
  ports:
    - port: 8000
      targetPort: 8000
