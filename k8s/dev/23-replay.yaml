apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay
  template:
    metadata:
      labels:
        app: replay
    spec:
      # sinon k8s injecte MQTT_PORT=tcp://... depuis le Service mqtt, ce qui casse la config des applis
      enableServiceLinks: false
      # attend que postgres réponde : sans ça, l'appli démarre avant le DNS ou la base et plante au premier essai
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.0-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: replay
          image: ghcr.io/bilnaa/pwytch-replay:0614b7574f612b5da4b6dcbe61f142104b6f7f0a
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: replay
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: MQTT_HOST
            - name: LIVES_DIR
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: LIVES_DIR
            - name: REPLAYS_DIR
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: REPLAYS_DIR
          # démarré : on laisse le temps à l'appli de booter avant de la surveiller
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          # prêt : sort du Service tant que l'appli ne répond pas
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          # vivant : redémarre le pod si l'appli ne répond plus
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - name: lives
              mountPath: /data/lives
              readOnly: true
            - name: replays
              mountPath: /data/replays
      volumes:
        - name: lives
          persistentVolumeClaim:
            claimName: stream-lives
        - name: replays
          persistentVolumeClaim:
            claimName: replay-files
---
apiVersion: v1
kind: Service
metadata:
  name: replay
  namespace: dev
spec:
  selector:
    app: replay
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: replay-files
  namespace: dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
