apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats
  template:
    metadata:
      labels:
        app: stats
    spec:
      # sinon k8s injecte MQTT_PORT=tcp://... depuis le Service mqtt, ce qui casse la config des applis
      enableServiceLinks: false
      # attend que postgres réponde : sans ça, l'appli démarre avant le DNS ou la base et plante au premier essai
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.0-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: stats
          image: ghcr.io/bilnaa/pwytch-stats:e68b75b6e41ac90669c4661cb3c65f7ff65cce1f
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: stats
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: REDIS_URL
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: MQTT_HOST
          # démarré : on laisse le temps à l'appli de booter avant de la surveiller
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          # prêt : sort du Service tant que l'appli ne répond pas
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          # vivant : redémarre le pod si l'appli ne répond plus
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  namespace: prod
spec:
  selector:
    app: stats
  ports:
    - port: 8000
      targetPort: 8000
