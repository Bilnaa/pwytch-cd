apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats
  template:
    metadata:
      labels:
        app: stats
    spec:
      # sinon k8s injecte MQTT_PORT=tcp://... depuis le Service mqtt, ce qui casse la config des applis
      enableServiceLinks: false
      containers:
        - name: stats
          image: ghcr.io/bilnaa/pwytch-stats:e68b75b6e41ac90669c4661cb3c65f7ff65cce1f
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: stats
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: REDIS_URL
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: MQTT_HOST
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  namespace: prod
spec:
  selector:
    app: stats
  ports:
    - port: 8000
      targetPort: 8000
