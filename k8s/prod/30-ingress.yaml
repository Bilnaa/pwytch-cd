# Point d'entrée de l'environnement : tout passe par main, qui sert le front et /api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pwytch
  namespace: prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pwytch.prd
      secretName: pwytch-tls # créé à la main avec mkcert, jamais dans Git
  rules:
    - host: pwytch.prd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main
                port:
                  number: 8000
