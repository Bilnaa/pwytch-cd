apiVersion: apps/v1
kind: Deployment
metadata:
  name: main
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main
  template:
    metadata:
      labels:
        app: main
      annotations:
        # FRONTEND_ORIGIN vient du ConfigMap, lu au démarrage : changer cette valeur force le redémarrage de main
        config-rev: "2"
    spec:
      # sinon k8s injecte MQTT_PORT=tcp://... depuis le Service mqtt, ce qui casse la config des applis
      enableServiceLinks: false
      containers:
        - name: main
          image: ghcr.io/bilnaa/pwytch-main:e68b75b6e41ac90669c4661cb3c65f7ff65cce1f
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: main
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: secret
            - name: STREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: STREAM_URL
            - name: LIVE_CHAT_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: LIVE_CHAT_URL
            - name: REPLAY_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: REPLAY_URL
            - name: SEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: SEARCH_URL
            - name: STATS_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: STATS_URL
            - name: BOOKMARKS_URL
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: BOOKMARKS_URL
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: FRONTEND_ORIGIN
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: pwytch-config
                  key: MQTT_HOST
          # démarré : on laisse le temps à l'appli de booter avant de la surveiller
          startupProbe:
            httpGet:
              path: /api
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          # prêt : sort du Service tant que l'appli ne répond pas
          readinessProbe:
            httpGet:
              path: /api
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          # vivant : redémarre le pod si l'appli ne répond plus
          livenessProbe:
            httpGet:
              path: /api
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: main
  namespace: prod
spec:
  selector:
    app: main
  ports:
    - port: 8000
      targetPort: 8000
